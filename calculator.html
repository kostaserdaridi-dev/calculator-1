<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости заказа</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f8f9fa;
        }
        .calculator-card {
            background: #fff;
            padding: 25px;
            max-width: 400px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input, button {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            background-color: #00d1b2;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #00b89c;
        }
        #result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h2>Калькулятор заказа</h2>
        
        <!-- Выбор товара из списка (в value записана цена товара) -->
        <div class="form-group">
            <label for="productSelect">Выберите товар:</label>
            <select id="productSelect">
                <option value="500">Ноутбук — 5000 руб.</option>
                <option value="150">Мышь компьютерная — 150 руб.</option>
                <option value="300">Клавиатура — 300 руб.</option>
            </select>
        </div>

        <!-- Текстовое поле для ввода количества -->
        <div class="form-group">
            <label for="quantityInput">Количество:</label>
            <input type="number" id="quantityInput" min="1" value="1" placeholder="Введите количество">
        </div>

        <!-- Кнопка подсчета -->
        <div class="form-group">
            <button id="calculateBtn">Рассчитать стоимость</button>
        </div>

        <!-- Вывод результата -->
        <div id="result">Стоимость заказа: 0 руб.</div>
    </div>

    <script>
        // Находим элементы на странице по их ID
        const productSelect = document.getElementById('productSelect');
        const quantityInput = document.getElementById('quantityInput');
        const calculateBtn = document.getElementById('calculateBtn');
        const resultDiv = document.getElementById('result');

        // Вешаем обработчик события "клик" на кнопку
        calculateBtn.addEventListener('click', function() {
            // Получаем цену выбранного товара (значение атрибута value у выбранного option)
            let price = parseFloat(productSelect.value);
            
            // Получаем введенное количество и преобразуем в число
            let quantity = parseInt(quantityInput.value);

            // Проверяем, введено ли корректное число
            if (isNaN(quantity) || quantity <= 0) {
                resultDiv.textContent = 'Пожалуйста, введите корректное количество!';
                resultDiv.style.color = 'red';
                return;
            }

            // Рассчитываем общую стоимость
            let totalCost = price * quantity;

            // Выводим результат на страницу
            resultDiv.textContent = `Стоимость заказа: ${totalCost} руб.`;
            resultDiv.style.color = '#2c3e50';
        });
    </script>

</body>
</html>
